name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb1-dev libx11-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      # The command-line simulator is not a shipped feature, so its tests only
      # run when it is asked for. Both configurations must be green.
      - name: Test the simulator build
        run: cargo test -p ortseam-cli --features simulator

      # The shipped binaries must contain no simulator at all: nothing in them
      # can put invented counts on screen or into a file.
      - name: Check the shipped binaries have no simulator
        run: |
          cargo build -p ortseam-gui -p ortseam-cli
          ! cargo tree -p ortseam-gui -e features | grep -q 'ortseam-gui feature "simulator"'
          ! cargo tree -p ortseam-cli -e features | grep -q 'ortseam-cli feature "simulator"'

      # The libraries and the command-line tool must build with no system
      # libraries at all, so they work in containers and on servers.
      - name: Build headless crates only
        run: cargo build -p ortseam-core -p ortseam-formats -p ortseam-device -p ortseam-jobs -p ortseam-report -p ortseam-cli

      - name: Build the desktop application without native dialogs
        run: cargo build -p ortseam-gui --no-default-features

      # macOS has no runner here and no ORTEC hardware anywhere, but the code
      # has to keep compiling for it. A type check is what can be had without a
      # machine, and it catches the ordinary mistake - a Windows-only call
      # reached from code that is not behind a cfg.
      - name: Check that everything still compiles for macOS
        run: |
          rustup target add aarch64-apple-darwin
          cargo check --target aarch64-apple-darwin --workspace

  lint:
    name: format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb1-dev libx11-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Documentation
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb1-dev libx11-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
