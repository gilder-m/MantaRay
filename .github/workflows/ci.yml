name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per branch. Pushing twice in a minute used to leave the first run
# going to the end for a commit nobody would ever look at again, which is a
# waste of a runner whether or not anybody is billed for it - and it puts the
# answer for the commit that matters behind the one that does not.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb1-dev libx11-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      # The command-line simulator is not a shipped feature, so its tests only
      # run when it is asked for. Both configurations must be green.
      - name: Test the simulator build
        run: cargo test -p mantaray-cli --features simulator

      # The shipped binaries must contain no simulator at all: nothing in them
      # can put invented counts on screen or into a file.
      # `!` and `grep` are shell, and the Windows runner would otherwise hand
      # this to PowerShell, which cannot parse it.
      - name: Check the shipped binaries have no simulator
        shell: bash
        run: |
          cargo build -p mantaray-gui -p mantaray-cli
          ! cargo tree -p mantaray-gui -e features | grep -q 'mantaray-gui feature "simulator"'
          ! cargo tree -p mantaray-cli -e features | grep -q 'mantaray-cli feature "simulator"'

      # The libraries and the command-line tool must build with no system
      # libraries at all, so they work in containers and on servers.
      - name: Build headless crates only
        run: cargo build -p mantaray-core -p mantaray-formats -p mantaray-device -p mantaray-jobs -p mantaray-report -p mantaray-cli

      - name: Build the desktop application without native dialogs
        run: cargo build -p mantaray-gui --no-default-features

      # macOS has no runner here and no ORTEC hardware anywhere, but the code
      # has to keep compiling for it. A type check is what can be had without a
      # machine, and it catches the ordinary mistake - a Windows-only call
      # reached from code that is not behind a cfg.
      - name: Check that everything still compiles for macOS
        run: |
          rustup target add aarch64-apple-darwin
          cargo check --target aarch64-apple-darwin --workspace

      # ARM Linux is where the small bench machines live - a Raspberry Pi
      # driving an instrument headless. Same rule as macOS was under before
      # 2026-08-07: a type check keeps the road open, and the release archive
      # waits until the program has actually run on one.
      - name: Check that everything still compiles for ARM Linux
        run: |
          rustup target add aarch64-unknown-linux-gnu
          cargo check --target aarch64-unknown-linux-gnu --workspace

  lint:
    name: format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb1-dev libx11-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Documentation
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb1-dev libx11-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
