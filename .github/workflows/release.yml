name: Release

# Pushing a v* tag builds the desktop application and the command-line tool and
# attaches the archives to a GitHub release, with a SHA-256 for each so a
# download can be checked against what was built here.
#
# Linux and Windows ship. macOS is built by CI on main and is not released yet:
# nothing has run there on real hardware, and an untested binary for a platform
# nobody has used is a promise this project cannot keep.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: MantaRay-windows-x86_64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: MantaRay-linux-x86_64.tar.gz
          # macOS is built by CI on every push and is deliberately not
          # released. Nothing has been run there on real hardware, and an
          # untested binary for a platform nobody has used is a promise this
          # project cannot keep. Add it back when somebody has driven an
          # instrument from one.
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb1-dev libx11-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p mantaray-gui -p mantaray-cli

      # The bridge to ORTEC hardware is 32-bit because ORTEC's libraries are,
      # and a 64-bit process cannot load them. Windows is the only platform
      # where it has anything to talk to.
      - name: Build the hardware bridge (Windows, 32-bit)
        if: runner.os == 'Windows'
        run: |
          rustup target add i686-pc-windows-msvc
          cargo build --release --target i686-pc-windows-msvc -p mantaray-mcb

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/mantaray-gui.exe" dist/
          Copy-Item "target/${{ matrix.target }}/release/mantaray.exe" dist/
          Copy-Item "target/i686-pc-windows-msvc/release/mantaray-mcb.exe" dist/
          Copy-Item README.md, CHANGELOG.md, LICENSE.md dist/
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.archive }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/mantaray-gui dist/
          cp target/${{ matrix.target }}/release/mantaray dist/
          cp README.md CHANGELOG.md LICENSE.md dist/
          tar -czf ${{ matrix.archive }} -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    name: attach to the release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      # A sum per archive, and one file holding both, so a download can be
      # checked against what was actually built here rather than trusted.
      - name: Checksums
        run: |
          sha256sum MantaRay-*.zip MantaRay-*.tar.gz | tee SHA256SUMS.txt
          {
            echo '## Checksums'
            echo
            echo 'Verify a download against what this workflow built:'
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            echo
            echo '`sha256sum -c SHA256SUMS.txt` on Linux, or'
            echo '`Get-FileHash <file> -Algorithm SHA256` on Windows.'
            echo
            echo 'macOS is built by CI but not released: nothing has been run'
            echo 'there against an instrument yet.'
          } > release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          append_body: true
          files: |
            MantaRay-windows-x86_64.zip
            MantaRay-linux-x86_64.tar.gz
            SHA256SUMS.txt
