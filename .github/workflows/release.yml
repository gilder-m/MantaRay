name: Release

# Pushing a v* tag builds the desktop application and the command-line tool
# for the three platforms and attaches the archives to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: MantaRay-windows-x86_64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: MantaRay-linux-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: MantaRay-macos-aarch64.tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb1-dev libx11-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p mantaray-gui -p mantaray-cli

      # The bridge to ORTEC hardware is 32-bit because ORTEC's libraries are,
      # and a 64-bit process cannot load them. Windows is the only platform
      # where it has anything to talk to.
      - name: Build the hardware bridge (Windows, 32-bit)
        if: runner.os == 'Windows'
        run: |
          rustup target add i686-pc-windows-msvc
          cargo build --release --target i686-pc-windows-msvc -p mantaray-mcb

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/mantaray-gui.exe" dist/
          Copy-Item "target/${{ matrix.target }}/release/mantaray.exe" dist/
          Copy-Item "target/i686-pc-windows-msvc/release/mantaray-mcb.exe" dist/
          Copy-Item README.md, CHANGELOG.md, LICENSE.md dist/
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.archive }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/mantaray-gui dist/
          cp target/${{ matrix.target }}/release/mantaray dist/
          cp README.md CHANGELOG.md LICENSE.md dist/
          tar -czf ${{ matrix.archive }} -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    name: attach to the release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            MantaRay-windows-x86_64.zip
            MantaRay-linux-x86_64.tar.gz
            MantaRay-macos-aarch64.tar.gz
