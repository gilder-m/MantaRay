name: Release

# Pushing a v* tag builds the desktop application and the command-line tool and
# attaches the archives to a GitHub release, with a SHA-256 for each so a
# download can be checked against what was built here.
#
# Linux, Windows and macOS on Apple silicon ship. macOS was held back until
# somebody had driven an instrument from one, which happened on 2026-08-07: an
# ORTEC 926 through a DPM-USB adapter, over libusb with no vendor driver, read
# out and stepped through a preset from a Mac. Intel macs are still not built,
# for the same reason macOS was not: nothing has run there.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: MantaRay-windows-x86_64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: MantaRay-linux-x86_64.tar.gz
          # Apple silicon only. macos-latest runners are arm64, which is what
          # the instrument was driven from; an Intel build would be the same
          # untested promise this list used to refuse to make.
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: MantaRay-macos-arm64.tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb1-dev libx11-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p mantaray-gui -p mantaray-cli

      # On Windows the bridge is 32-bit because ORTEC's libraries are, and a
      # 64-bit process cannot load them.
      - name: Build the hardware bridge (Windows, 32-bit)
        if: runner.os == 'Windows'
        run: |
          rustup target add i686-pc-windows-msvc
          cargo build --release --target i686-pc-windows-msvc -p mantaray-mcb

      # Elsewhere it reaches the instrument over libusb with no vendor library
      # at all, so it is built for the platform's own architecture. It used to
      # be built only for Windows, on the reasoning that Windows was the only
      # place it had anything to talk to - which stopped being true when the
      # in-house USB path landed, and left the Linux archive unable to reach an
      # instrument at all.
      - name: Build the hardware bridge
        if: runner.os != 'Windows'
        run: cargo build --release --target ${{ matrix.target }} -p mantaray-mcb

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/mantaray-gui.exe" dist/
          Copy-Item "target/${{ matrix.target }}/release/mantaray.exe" dist/
          Copy-Item "target/i686-pc-windows-msvc/release/mantaray-mcb.exe" dist/
          Copy-Item README.md, CHANGELOG.md, LICENSE.md dist/
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.archive }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/mantaray-gui dist/
          cp target/${{ matrix.target }}/release/mantaray dist/
          cp target/${{ matrix.target }}/release/mantaray-mcb dist/
          cp README.md CHANGELOG.md LICENSE.md dist/
          tar -czf ${{ matrix.archive }} -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    name: attach to the release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      # A sum per archive, and one file holding both, so a download can be
      # checked against what was actually built here rather than trusted.
      - name: Checksums
        run: |
          sha256sum MantaRay-*.zip MantaRay-*.tar.gz | tee SHA256SUMS.txt
          {
            echo '## Checksums'
            echo
            echo 'Verify a download against what this workflow built:'
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            echo
            echo '`sha256sum -c SHA256SUMS.txt` on Linux and macOS, or'
            echo '`Get-FileHash <file> -Algorithm SHA256` on Windows.'
            echo
            echo 'The macOS build is for Apple silicon and is unsigned, so the'
            echo 'first run needs `xattr -d com.apple.quarantine` on the'
            echo 'extracted binaries or a right-click Open. Intel macs are not'
            echo 'built: nothing has run there.'
          } > release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          append_body: true
          files: |
            MantaRay-windows-x86_64.zip
            MantaRay-linux-x86_64.tar.gz
            MantaRay-macos-arm64.tar.gz
            SHA256SUMS.txt
