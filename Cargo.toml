[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/gilder-m/MantaRay"
authors = ["Gilder Montepeque"]
description = "Multichannel-analyzer (MCA) emulation and gamma-spectroscopy workbench for ORTEC hardware"
keywords = ["gamma-spectroscopy", "mca", "hpge", "nuclear", "spectrum"]
categories = ["science", "visualization"]

[workspace.dependencies]
mantaray-core = { path = "crates/mantaray-core", version = "0.2.0" }
mantaray-formats = { path = "crates/mantaray-formats", version = "0.2.0" }
mantaray-device = { path = "crates/mantaray-device", version = "0.2.0" }
mantaray-jobs = { path = "crates/mantaray-jobs", version = "0.2.0" }
mantaray-report = { path = "crates/mantaray-report", version = "0.2.0" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
