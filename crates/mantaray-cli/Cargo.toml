[package]
name = "mantaray-cli"
description = "Headless command-line workbench: convert, analyse, report and run .JOB automation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.4", features = ["derive"] }
mantaray-core.workspace = true
mantaray-device.workspace = true
mantaray-formats.workspace = true
mantaray-jobs.workspace = true
mantaray-report.workspace = true

[features]
default = []
# `acquire` and `serve`, which both invent counts. Deliberately NOT default,
# for the same reason the GUI's simulator is not: a file of simulated data is
# indistinguishable from a measurement once it has been written and sent on.
# CI runs the suite both ways; see .github/workflows.
simulator = []

[[bin]]
name = "mantaray"
path = "src/main.rs"

[dev-dependencies]
mantaray-core = { path = "../mantaray-core" }
mantaray-formats = { path = "../mantaray-formats" }
