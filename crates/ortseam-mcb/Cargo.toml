[package]
name = "ortseam-mcb"
description = "32-bit bridge to ORTEC's UMCBI library, so a 64-bit ortseam can reach real MCB hardware"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
ortseam-core.workspace = true
ortseam-formats.workspace = true
chrono = "0.4.45"

[[bin]]
name = "ortseam-mcb"
path = "src/main.rs"

# libusb, for the platforms with no vendor driver. Not on Windows, where
# ORTEC's driver already owns the adapter and is reached through its own IOCTLs.
[target.'cfg(not(windows))'.dependencies]
nusb = "0.2"
